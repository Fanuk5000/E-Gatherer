[project]
name = "E-Gatherer"
version = "0.1.0"
description = "An application that gathers data from internet shops for Ukraine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "selenium>=4.51.0",
]

[project.scripts]
e-gatherer = "e_gatherer:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
