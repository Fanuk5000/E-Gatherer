[project]
name = "E-Gatherer"
version = "0.1.0"
description = "An application that gathers data from internet shops in Ukraine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "playwright>=1.65.1",
    "sqlalchemy>=2.1.8",
]

#[project.scripts]
#e-gatherer = "e_gatherer:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]      
package = false
