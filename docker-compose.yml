# Docker Compose configuration for E-gatherer stack (PostgreSQL 17 + ETL Scraper)
# Following Compose Specification best practices (maintainability, security, resource control)

services:
  db:
    image: postgres:17.2-alpine
    container_name: postgres_db
    restart: unless-stopped
    shm_size: 128mb # allocated shared memory for PostgreSQL from /dev/shm

    ports:
      - "${POSTGRES_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z # z for SELinux
      - ./database/02-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro,z
    networks:
      - db_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-egatherer}"]
      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  scraper:
    image: localhost/e-gatherer:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egatherer_scraper
    restart: unless-stopped
    shm_size: 1g # allocated shared memory for headless Firefox IPC

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TZ: Europe/Kyiv

    volumes:
      - scraper_logs:/app/logs

    networks:
      - db_network

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

networks:
  db_network:
    driver: bridge

volumes:
  postgres_data:
  scraper_logs:
